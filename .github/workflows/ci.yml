name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python -m henriquefy.ingest.build_index --check
      - name: install smoke test from a built wheel
        run: |
          uv build
          WHEEL="$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          V="$(uvx --from "$WHEEL" henriquefy --version | cut -d' ' -f2)"
          test "$V" = "$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          cd "$(mktemp -d)"
          uvx --from "$WHEEL" henriquefy install --project
          # the source SKILL.md already holds the key, so check the stamped value
          grep -qx "  henriquefy_version: $V" .claude/skills/henriquefy/SKILL.md
          test -f .claude/skills/henriquefy/references/kb/INDEX.md
