[project]
name = "henriquefy"
version = "0.5.0"
description = "Claude Code skills that apply Henrique Bastos's Python, OO, API-design and testing practices to your code: ask, check, grade, transform."
readme = "README.md"
authors = [{ name = "Ivan Neto", email = "ivan.cr.neto@gmail.com" }]
requires-python = ">=3.12"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "kb/LICENSE", "NOTICE.md"]
keywords = ["claude-code", "skills", "python", "code-quality", "henrique-bastos"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ivancrneto/henriquefy"
Repository = "https://github.com/ivancrneto/henriquefy"
Issues = "https://github.com/ivancrneto/henriquefy/issues"

[project.scripts]
henriquefy = "henriquefy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/henriquefy"]

[tool.hatch.build.targets.wheel.force-include]
"kb" = "henriquefy/kb"
"skills" = "henriquefy/skills"
"state" = "henriquefy/state"

[tool.hatch.build.targets.sdist]
include = ["src", "kb", "skills", "state", "tests", "README.md", "LICENSE", "NOTICE.md", "PLAN.md"]

[dependency-groups]
dev = [
    "django>=4.2",
    "pytest>=8",
    "ruff>=0.6",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
# content directories hold verbatim excerpts; never reformat them
extend-exclude = ["kb", "skills", "evals", "sources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
